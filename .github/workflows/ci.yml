name: Continuous integration

on:
  pull_request:
    branches: [ "main", "develop" ]
  push:
    branches: [ "main", "develop" ]

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    env:
      CI: false
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies, build and test
        run: |
          npm install
          npm run build
          npm run test
